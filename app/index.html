<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Startseite</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14161a; color: #e8e6e1;
      font-family: "Samsung One", "Helvetica Neue", sans-serif; }
    .box { height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 24px; font-size: 32px; }
    .klein { font-size: 22px; opacity: .6; }
  </style>
</head>
<body>
  <div class="box">
    <div id="status">Startseite wird geladen …</div>
    <div class="klein" id="detail"></div>
  </div>
  <script>
    // Dünner Loader: Die eigentliche Startseite liegt auf dem Homeserver.
    // Änderungen dort brauchen kein Update dieses Moduls.
    //
    // Erreichbarkeit wird über ein kleines Bild geprüft statt per XHR:
    // Bilder dürfen von fremder Herkunft geladen werden, XHR braucht dafür
    // CORS-Header und scheitert sonst still mit "onerror".
    var ZIEL = "http://192.168.178.20:8095/";
    var versuch = 0;

    function pruefenUndLaden() {
      versuch++;
      var fertig = false;
      var img = new Image();
      var timer = setTimeout(function () {
        if (fertig) return;
        fertig = true;
        fehler("Zeitüberschreitung beim Homeserver");
      }, 5000);
      img.onload = function () {
        if (fertig) return;
        fertig = true;
        clearTimeout(timer);
        window.location.replace(ZIEL);
      };
      img.onerror = function () {
        if (fertig) return;
        fertig = true;
        clearTimeout(timer);
        fehler("Homeserver nicht erreichbar");
      };
      img.src = ZIEL + "ping.gif?t=" + Date.now();
    }

    var MAX_VERSUCHE = 6;
    var wiederholung = null;

    function fehler(text) {
      document.getElementById("status").textContent = text;
      var hinweis = versuch < MAX_VERSUCHE
        ? "Neuer Versuch in 5 s (" + versuch + "/" + MAX_VERSUCHE + ")"
        : "Keine weiteren Versuche. OK = erneut versuchen";
      document.getElementById("detail").textContent =
        hinweis + " – Zurück = beenden – Ziel " + ZIEL +
        " – Loader läuft auf " + window.location.protocol + "//" + window.location.host;
      if (versuch < MAX_VERSUCHE) {
        wiederholung = setTimeout(pruefenUndLaden, 5000);
      }
    }

    function beenden() {
      clearTimeout(wiederholung);
      try {
        if (window.tizen && tizen.application) {
          tizen.application.getCurrentApplication().exit();
          return;
        }
      } catch (e) { /* Fallback unten */ }
      if (window.history.length > 1) { window.history.back(); }
    }

    document.addEventListener("keydown", function (e) {
      if (e.keyCode === 10009 || e.keyCode === 8 || e.keyCode === 27) {   // Zurück / Backspace / Esc
        e.preventDefault();
        beenden();
      } else if (e.keyCode === 13) {                                      // OK
        e.preventDefault();
        clearTimeout(wiederholung);
        versuch = 0;
        document.getElementById("status").textContent = "Startseite wird geladen …";
        pruefenUndLaden();
      }
    });

    pruefenUndLaden();
  </script>
</body>
</html>
